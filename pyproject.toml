[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-energy-forecasting-analytics"
version = "0.1.0"
description = "Electricity demand analytics and leakage-safe forecasting for France"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.1,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
forecast = ["scikit-learn>=1.4,<2", "statsmodels>=0.14,<1", "xgboost>=2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
